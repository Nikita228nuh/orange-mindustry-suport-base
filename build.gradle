apply plugin: "java"

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"]
        }
    }
}

repositories {
    mavenCentral()

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    mindustryVersion = "v159.7"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

jar {
    archiveFileName = "OrangeSupport159.jar"

    // Include compiled .class files
    from sourceSets.main.output

    // Put mod.json at the JAR root
    from(rootDir) {
        include "mod.json"
    }

    // Put assets in the JAR
    from("assets") {
        into "assets"
    }
}