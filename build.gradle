apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }
}

ext {
    mindustryVersion = "v160.5"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register("jarAndroid") {
    dependsOn "jar"

    doLast {
        def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")

        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException("No Android SDK found.")
        }

        def platformRoot = new File("$sdkRoot/platforms/")
            .listFiles()
            .findAll { new File(it, "android.jar").exists() }
            .sort()
            .reverse()
            .find { true }

        if (!platformRoot) {
            throw new GradleException("No Android platform found.")
        }

        def buildTools = new File("$sdkRoot/build-tools")
            .listFiles()
            .findAll { new File(it, "d8").exists() }
            .sort()
            .reverse()
            .find { true }

        if (!buildTools) {
            throw new GradleException("No Android build-tools/d8 found.")
        }

        def classpath = (
            configurations.compileClasspath.asList() +
            [new File(platformRoot, "android.jar")]
        ).collect {
            "--classpath \"$it.path\""
        }.join(" ")

        def d8 = new File(buildTools, "d8").absolutePath

        def command =
            "\"$d8\" $classpath " +
            "--min-api 21 " +
            "--output build/libs/OrangeSupportAndroid.jar " +
            "build/libs/OrangeSupport160Desktop.jar"

        println command

        def process = command.execute(null, project.file("build/libs"))
        process.waitForProcessOutput(System.out, System.err)

        if (process.exitValue() != 0) {
            throw new GradleException("D8 failed.")
        }
    }
}

jar {
    archiveFileName = "OrangeSupport160Desktop.jar"

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    from(projectDir) {
        include "mod.json"
    }

    from("assets") {
        include "**"
    }
}

tasks.register("deploy", Jar) {
    dependsOn "jarAndroid"
    dependsOn "jar"

    archiveFileName = "OrangeSupport160.jar"

    from {
        [
            zipTree("build/libs/OrangeSupport160Desktop.jar"),
            zipTree("build/libs/OrangeSupportAndroid.jar")
        ]
    }

    doLast {
        delete "build/libs/OrangeSupport160Android.jar"
    }
}