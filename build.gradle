apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }
}

ext {
    mindustryVersion = "v160.5"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

/*
 * Desktop JAR
 */
jar {
    archiveFileName = "OrangeSupport160Desktop.jar"

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    from(projectDir) {
        include "mod.json"
    }

    from("assets") {
        include "**"
    }
}

/*
 * Build Android-compatible JAR
 */
tasks.register("jarAndroid") {
    dependsOn("jar")

    doLast {
        def sdkRoot = System.getenv("ANDROID_HOME")

        if (!sdkRoot) {
            sdkRoot = System.getenv("ANDROID_SDK_ROOT")
        }

        if (!sdkRoot) {
            throw new GradleException("ANDROID_HOME / ANDROID_SDK_ROOT not found.")
        }

        def sdk = new File(sdkRoot)

        if (!sdk.exists()) {
            throw new GradleException("Android SDK not found: ${sdk.absolutePath}")
        }

        /*
         * Find android.jar
         */
        def platformsDir = new File(sdk, "platforms")

        def platformRoot = platformsDir.listFiles()
            ?.findAll { new File(it, "android.jar").isFile() }
            ?.sort { a, b -> b.name <=> a.name }
            ?.find { true }

        if (!platformRoot) {
            throw new GradleException(
                "No Android platform with android.jar found."
            )
        }

        /*
         * Find D8
         */
        def buildToolsDir = new File(sdk, "build-tools")

        def buildTools = buildToolsDir.listFiles()
            ?.findAll { new File(it, "d8").isFile() }
            ?.sort { a, b -> b.name <=> a.name }
            ?.find { true }

        if (!buildTools) {
            throw new GradleException(
                "No Android build-tools with d8 found."
            )
        }

        def d8 = new File(buildTools, "d8")
        def androidJar = new File(platformRoot, "android.jar")

        def desktopJar = file(
            "build/libs/OrangeSupport160Desktop.jar"
        )

        def androidJarOutput = file(
            "build/libs/OrangeSupportAndroid.jar"
        )

        println "Android SDK: ${sdk.absolutePath}"
        println "Android platform: ${androidJar.absolutePath}"
        println "D8: ${d8.absolutePath}"
        println "Desktop JAR: ${desktopJar.absolutePath}"

        /*
         * Make sure output directory exists
         */
        androidJarOutput.parentFile.mkdirs()

        /*
         * Run D8 using ProcessBuilder.
         */
        def command = [
            d8.absolutePath,
            "--classpath",
            androidJar.absolutePath,
            "--min-api",
            "21",
            "--output",
            androidJarOutput.absolutePath,
            desktopJar.absolutePath
        ]

        println "Running D8..."

        def process = new ProcessBuilder(command)
            .redirectErrorStream(true)
            .start()

        process.inputStream.eachLine { line ->
            println line
        }

        def exitCode = process.waitFor()

        if (exitCode != 0) {
            throw new GradleException(
                "D8 failed with exit code ${exitCode}."
            )
        }

        println "Android JAR created successfully:"
        println androidJarOutput.absolutePath
    }
}

/*
 * Final Mindustry mod JAR
 */
tasks.register("deploy", Jar) {
    dependsOn("jarAndroid")

    archiveFileName = "OrangeSupport160.jar"

    from {
        zipTree("build/libs/OrangeSupport160Desktop.jar")
    }

    from {
        zipTree("build/libs/OrangeSupportAndroid.jar")
    }

    doLast {
        println ""
        println "========================================"
        println "OrangeSupport160.jar created!"
        println "========================================"
        println archiveFile.get().asFile.absolutePath
    }
}