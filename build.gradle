apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }
}

ext {
    mindustryVersion = "v160.5"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveFileName = "OrangeSupport160Desktop.jar"

    from(sourceSets.main.output)

    from(projectDir) {
        include "mod.json"
    }

    from("assets") {
        into "assets"
    }
}

tasks.register("jarAndroid") {
    dependsOn("jar")

    doLast {
        def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")

        if (!sdkRoot) {
            throw new GradleException("ANDROID_HOME/ANDROID_SDK_ROOT not found.")
        }

        def sdk = file(sdkRoot)

        def platforms = fileTree(new File(sdk, "platforms")) {
            include "*/android.jar"
        }.files.sort().reverse()

        if (platforms.isEmpty()) {
            throw new GradleException("No Android platform with android.jar found.")
        }

        def androidJar = platforms.first()

        def buildToolsDirs = file(sdk, "build-tools").listFiles()
            ?.findAll { new File(it, "d8").exists() }
            ?.sort { a, b -> b.name <=> a.name }

        if (!buildToolsDirs || buildToolsDirs.isEmpty()) {
            throw new GradleException("No Android build-tools with d8 found.")
        }

        def d8 = new File(buildToolsDirs.first(), "d8")

        def desktopJar = file("$buildDir/libs/OrangeSupport160Desktop.jar")
        def dexDir = file("$buildDir/dex")
        def androidJarOutput = file("$buildDir/libs/OrangeSupport160Android.jar")

        delete dexDir
        delete androidJarOutput
        mkdir dexDir

        exec {
            executable d8.absolutePath

            args "--min-api", "21"
            args "--lib", androidJar.absolutePath
            args "--output", dexDir.absolutePath
            args desktopJar.absolutePath
        }

        ant.jar(
            destfile: androidJarOutput,
            basedir: dexDir
        )

        println "Created Android JAR: $androidJarOutput"
    }
}

tasks.register("deploy", Jar) {
    dependsOn("jarAndroid")

    archiveFileName = "OrangeSupport160.jar"

    from {
        zipTree(file("$buildDir/libs/OrangeSupport160Desktop.jar"))
    }

    from {
        zipTree(file("$buildDir/libs/OrangeSupport160Android.jar"))
    }
}