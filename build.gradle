apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/[revision]/download/dependencies.jar"
        }
        metadataSources {
            artifact()
        }
    }

    ivy {
        url = "https://github.com/"
        patternLayout {
            artifact "/[organisation]/[module]/releases/download/master/[revision].jar"
        }
        metadataSources {
            artifact()
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    mindustryVersion = "v159.7"
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

jar {
    archiveFileName = "${project.name}.jar"

    // Put compiled Java classes into the JAR
    from sourceSets.main.output

    // Include mod.json at the ROOT
    from(rootDir) {
        include "mod.json"
    }

    // Include all PNGs/assets
    from("assets") {
        into "assets"
    }
}
