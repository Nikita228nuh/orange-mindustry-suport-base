name: Build Mindustry Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop JAR
        run: gradle jar --no-daemon

      - name: Prepare mod JAR
        run: |
          mkdir -p out
          cp build/libs/OrangeSupport1597Desktop.jar out/OrangeSupport1597.jar

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: OrangeSupport1597
          path: out/OrangeSupport1597.jar
