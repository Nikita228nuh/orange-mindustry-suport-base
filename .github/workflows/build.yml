name: Build Mindustry Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build mod
        run: |
          gradle clean deploy --stacktrace

      - name: Show built files
        run: |
          echo "Files created:"
          find build/libs -type f -name "*.jar" -print

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: OrangeSupport160
          path: build/libs/OrangeSupport160.jar
          if-no-files-found: error